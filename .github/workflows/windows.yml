name: Windows CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/DroidLab.Desktop -c Release
      - run: dotnet publish src/DroidLab.Desktop -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: DroidLab-win-x64
          path: publish/
          if-no-files-found: error
