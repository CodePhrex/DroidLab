name: Windows CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Audit NuGet dependencies
        run: |
          dotnet restore tests/DroidLab.Devices.Tests -p:NuGetAudit=true -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1903%3BNU1904'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/DroidLab.Desktop -p:NuGetAudit=true -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1903%3BNU1904'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet test tests/DroidLab.Devices.Tests -c Release
      - run: dotnet build src/DroidLab.Desktop -c Release
      - run: dotnet publish src/DroidLab.Desktop -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: DroidLab-win-x64
          path: publish/
          if-no-files-found: error
      - name: Install Inno Setup
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package release candidate
        run: ./installer/Package.ps1
      - name: Verify release artifacts
        run: ./installer/Verify-Artifacts.ps1
      - name: Installer smoke test
        run: ./installer/Smoke-Test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DroidLab-release-candidate
          path: dist/
          if-no-files-found: error
